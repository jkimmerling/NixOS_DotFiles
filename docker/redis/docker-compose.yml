version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"  # Host access
    networks:
      - app-network   # Container-to-container access
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  redis_data:
